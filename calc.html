<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ArchTrack - Carbon Footprint Estimator</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/calc.css">
</head>

<body>
    <header class="navbar">
        <div class="logo">
            <a href="index.html" style="text-decoration: none; color: inherit;">ArchTrack</a>
        </div>

        <nav>
            <a href="index.html#home">Home</a>

            <div class="dropdown">
                <a href="#">About ▼</a>
                <div class="dropdown-menu">
                    <a href="contactus.html">Contact Us</a>
                    <a href="lm.html">Learn More</a>
                </div>
            </div>

            <a href="login.html" id="login-btn">Log In</a>
        </nav>
    </header>

    <main class="calculator-page">
        <div class="card">
            <p class="small-title">🌱 ESTIMATE YOUR IMPACT</p>
            <h1>Carbon Footprint <span>Estimator</span></h1>
            <p class="subtitle">Calculate your household's monthly carbon footprint.</p>

            
            <form action="carbon.html" method="GET">
                <div class="input-group">
                    <label for="travel">Monthly Travel (Kilometers)</label>
                    <input type="number" id="travel" name="travel" placeholder="e.g., 500" required>
                </div>

                <div class="input-group">
                    <label for="electricity">Monthly Electricity (kWh)</label>
                    <input type="number" id="electricity" name="electricity" placeholder="e.g., 300" required>
                </div>

                <div class="input-group">
                    <label for="diet">Primary Diet Type</label>
                    <select id="diet" name="diet" required>
                    <option value="" disabled selected>Select your diet</option>
                    <option value="high">High Meat Consumption</option>
                    <option value="med">Moderate Meat Consumption</option>
                    <option value="low">Vegetarian / Vegan (Low)</option>
                    </select>
                </div>

                <button type="submit" class="btn-primary">Estimate Footprint</button>
            </form>
        </div>
    </main>

    <footer>
        <p>ArchTrack © 2026</p>
    </footer>
    <script src="js/calc.js"></script>
</body>

</html>
