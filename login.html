<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ArchTrack - Log In</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/login.css">
</head>

<body>
    <header class="navbar">
        <div class="logo">
            <a href="index.html" style="text-decoration: none; color: inherit;">ArchTrack</a>
        </div>

        <nav>
            <a href="index.html#home">Home</a>

            <div class="dropdown">
                <a href="#">About ▼</a>
                <div class="dropdown-menu">
                    <a href="contactus.html">Contact Us</a>
                    <a href="lm.html">Learn More</a>
                </div>
            </div>

            <a href="login.html" id="login-btn">Log In</a>
        </nav>
    </header>

    <main class="login-page">
        <div class="card">
            <p class="small-title"> WELCOME BACK</p>
            <h1>Log In to <span>ArchTrack</span></h1>
            <p class="subtitle">Access your personal carbon footprint dashboard.</p>

            <form action="#" method="POST">
                <div class="input-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" placeholder="you@example.com" required>
                </div>

                <div class="input-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="••••••••" required>
                </div>

                <div class="form-options">
                    <div class="checkbox-group">
                        <input type="checkbox" id="remember" name="remember">
                        <label for="remember" style="margin: 0; font-weight: normal;">Remember me</label>
                    </div>
                    <a href="#" class="forgot-link">Forgot password?</a>
                </div>

                <button type="submit" class="btn-primary">Log In</button>
            </form>

            <div class="signup-prompt">
                Don't have an account? <a href="signup.html">Sign up here</a>
            </div>
        </div>
    </main>

    <footer>
        <p>ArchTrack © 2026</p>
    </footer>

    <script src="js/login.js"></script>
</body>

</html>
