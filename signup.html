<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ArchTrack - Sign Up</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/login.css">
</head>

<body>
    <header class="navbar">
        <div class="logo">
            <a href="index.html" style="text-decoration: none; color: inherit;">ArchTrack</a>
        </div>

        <nav>
            <a href="index.html#home">Home</a>

            <div class="dropdown">
                <a href="#">About ▼</a>
                <div class="dropdown-menu">
                    <a href="contactus.html">Contact Us</a>
                    <a href="lm.html">Learn More</a>
                </div>
            </div>

            <a href="login.html" id="login-btn">Log In</a>
        </nav>
    </header>

    <main class="login-page">
        <div class="card">
            <p class="small-title"> JOIN ARCHTRACK</p>
            <h1>Create an <span>Account</span></h1>
            <p class="subtitle">Sign up to save and track your carbon footprint.</p>

            <form action="#" method="POST">
                <div class="input-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" placeholder="you@example.com" required>
                </div>

                <div class="input-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="••••••••" required>
                </div>

                <button type="submit" class="btn-primary">Sign Up</button>
            </form>

            <div class="signup-prompt">
                Already have an account? <a href="login.html">Log in here</a>
            </div>
        </div>
    </main>

    <footer>
        <p>ArchTrack © 2026</p>
    </footer>

    <script src="js/signup.js"></script>
</body>

</html>
